name: XRAY 406 synthetic same-actor ref enforcement
on:
  push:
    branches: [pilot-driver]
    paths: ['.github/workflows/pilot-same-actor.yml']
permissions:
  contents: write
jobs:
  same-actor:
    if: github.repository == 'gokaydonmez39-jpg/xray-406-public-synthetic-pilot-20261115' && github.event_name == 'push' && github.ref == 'refs/heads/pilot-driver' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check both refs with one ephemeral GitHub Actions installation token
        env:
          GH_PILOT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = "gokaydonmez39-jpg/xray-406-public-synthetic-pilot-20261115"
          BASE = "e61ad2b0d507462d6c5b14129bed30fed4270aa2"
          GREEN = "e61ad2b0d507462d6c5b14129bed30fed4270aa2"
          SECOND_RED = "c1c86b7840a93824e32ba43e12cf4e98f1336ff6"
          SECOND_GREEN = "562a4af03302889063b9c98e7d9cd7fb99624ce4"
          PROTECTED = "pilot-protected"
          FIRST_BASE = "763e977ded153d51beefd3306e8eefd72926c24a"
          ALLOWED = "pilot-allowed"
          FORBIDDEN = "pilot-forbidden"
          HOST = "https://api.github.com/repos/" + REPO + "/"
          def require(ok, label):
              if not ok:
                  raise SystemExit(label)
          def call(method, path, data=None):
              req = urllib.request.Request(HOST+path, method=method,
                    data=None if data is None else json.dumps(data).encode(),
                    headers={"Authorization":"Bearer "+os.environ["GH_PILOT_TOKEN"],
                             "Accept":"application/vnd.github+json",
                             "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as exc:
                  return exc.code, json.load(exc)
          def read_ref(ref):
              status, data = call("GET","git/ref/heads/"+ref)
              require(status==200, "REF_READ_UNAVAILABLE")
              return data["object"]["sha"]
          def set_ref(ref, head):
              require(ref in (ALLOWED, FORBIDDEN, PROTECTED), "REF_OUTSIDE_TEST")
              return call("PATCH","git/refs/heads/"+ref,{"sha":head,"force":False})

          require(os.environ["GITHUB_REPOSITORY"]==REPO, "REPO_OUTSIDE_TEST")
          rules_status, rules = call("GET","rulesets/27280990")
          require(rules_status==200 and rules["enforcement"]=="active"
                  # Read-only rule view can omit bypass_actors; confirm independently.
                  and ("bypass_actors" not in rules or rules["bypass_actors"] == [])
                  and rules["conditions"]["ref_name"]=={"include":["refs/heads/"+FORBIDDEN],"exclude":[]}
                  and {"creation","update"} <= {r["type"] for r in rules["rules"]},
                  "EXACT_FORBIDDEN_RULE_UNAVAILABLE")
          require(read_ref(FORBIDDEN)==FIRST_BASE and read_ref(ALLOWED)==BASE
                  and read_ref(PROTECTED)==BASE, "FIXTURE_DRIFT")

          exact_status, exact_rule = call("GET","rulesets/27280935")
          exact = {"context":"xray-406-pilot-required-ci","integration_id":15368}
          require(exact_status==200 and exact_rule["enforcement"]=="active"
                  and ("bypass_actors" not in exact_rule or exact_rule["bypass_actors"] == [])
                  and exact_rule["conditions"]["ref_name"]=={"include":["refs/heads/"+PROTECTED],"exclude":[]}
                  and any(r["type"]=="required_status_checks" and
                          r["parameters"]["required_status_checks"]==[exact]
                          for r in exact_rule["rules"]), "EXACT_CI_RULE_UNAVAILABLE")
          for candidate, expected in ((SECOND_RED, "failure"), (SECOND_GREEN, "success")):
              s, rows = call("GET","commits/"+candidate+"/check-runs")
              found = [i for i in rows["check_runs"] if i["head_sha"]==candidate
                       and i["name"]==exact["context"] and i["app"]["id"]==15368]
              require(s==200 and len(found)==1 and found[0]["status"]=="completed"
                      and found[0]["conclusion"]==expected, "CHECK_NOT_EXACT")

          status, denied = set_ref(FORBIDDEN, SECOND_GREEN)
          require(status==422 and "cannot update this protected ref" in denied["message"].lower()
                  and read_ref(FORBIDDEN)==FIRST_BASE, "FORBIDDEN_NOT_REJECTED")
          print(json.dumps({"gate":"FORBIDDEN_REF", "http":status,"result":"SERVER_REJECTED"}))
          status, published = set_ref(ALLOWED, SECOND_GREEN)
          require(status==200 and published["object"]["sha"]==SECOND_GREEN
                  and read_ref(ALLOWED)==SECOND_GREEN, "ALLOWED_NOT_WRITTEN")
          print(json.dumps({"gate":"ALLOWED_REF", "http":status,"result":"SERVER_ACCEPTED"}))
          status, denied = set_ref(PROTECTED, SECOND_RED)
          message=denied.get("message","").lower()
          require(status==422 and "xray-406-pilot-required-ci" in message
                  and ("failing" in message or "failed" in message)
                  and read_ref(PROTECTED)==BASE, "RED_NOT_REJECTED")
          print(json.dumps({"gate":"RED_CI","http":status,"result":"SERVER_REJECTED"}))
          status, published = set_ref(PROTECTED, SECOND_GREEN)
          require(status==200 and published["object"]["sha"]==SECOND_GREEN
                  and read_ref(PROTECTED)==SECOND_GREEN and read_ref(FORBIDDEN)==FIRST_BASE,
                  "GREEN_NOT_WRITTEN")
          print(json.dumps({"gate":"GREEN_CI","http":status,"result":"SERVER_ACCEPTED"}))
          PY
