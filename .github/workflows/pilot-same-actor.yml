name: XRAY 406 synthetic same-actor ref enforcement
on:
  push:
    branches: [pilot-driver]
    paths: ['.github/workflows/pilot-same-actor.yml']
permissions:
  contents: write
jobs:
  same-actor:
    if: github.repository == 'gokaydonmez39-jpg/xray-406-public-synthetic-pilot-20261115' && github.event_name == 'push' && github.ref == 'refs/heads/pilot-driver' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check both refs with one ephemeral GitHub Actions installation token
        env:
          GH_PILOT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = "gokaydonmez39-jpg/xray-406-public-synthetic-pilot-20261115"
          BASE = "763e977ded153d51beefd3306e8eefd72926c24a"
          GREEN = "e61ad2b0d507462d6c5b14129bed30fed4270aa2"
          ALLOWED = "pilot-allowed"
          FORBIDDEN = "pilot-forbidden"
          HOST = "https://api.github.com/repos/" + REPO + "/"
          def require(ok, label):
              if not ok:
                  raise SystemExit(label)
          def call(method, path, data=None):
              req = urllib.request.Request(HOST+path, method=method,
                    data=None if data is None else json.dumps(data).encode(),
                    headers={"Authorization":"Bearer "+os.environ["GH_PILOT_TOKEN"],
                             "Accept":"application/vnd.github+json",
                             "Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as res:
                      return res.status, json.load(res)
              except urllib.error.HTTPError as exc:
                  return exc.code, json.load(exc)
          def read_ref(ref):
              status, data = call("GET","git/ref/heads/"+ref)
              require(status==200, "REF_READ_UNAVAILABLE")
              return data["object"]["sha"]
          def set_ref(ref):
              require(ref in (ALLOWED, FORBIDDEN), "REF_OUTSIDE_TEST")
              return call("PATCH","git/refs/heads/"+ref,{"sha":GREEN,"force":False})

          require(os.environ["GITHUB_REPOSITORY"]==REPO, "REPO_OUTSIDE_TEST")
          rules_status, rules = call("GET","rulesets/27280990")
          require(rules_status==200 and rules["enforcement"]=="active"
                  # Read-only rule view can omit bypass_actors; confirm independently.
                  and ("bypass_actors" not in rules or rules["bypass_actors"] == [])
                  and rules["conditions"]["ref_name"]=={"include":["refs/heads/"+FORBIDDEN],"exclude":[]}
                  and {"creation","update"} <= {r["type"] for r in rules["rules"]},
                  "EXACT_FORBIDDEN_RULE_UNAVAILABLE")
          require(read_ref(FORBIDDEN)==BASE and read_ref(ALLOWED)==BASE, "FIXTURE_DRIFT")
          status, result = set_ref(FORBIDDEN)
          message = str(result.get("message","")).lower()
          require(status in (403,422) and ("rule violations" in message or "protected" in message)
                  and "pilot-forbidden" in message and read_ref(FORBIDDEN)==BASE,
                  "FORBIDDEN_REF_NOT_PROVEN")
          print(json.dumps({"ref":FORBIDDEN,"sha":BASE,"http":status,"result":"SERVER_RULE_REJECTED"}))
          status, result = set_ref(ALLOWED)
          require(status==200 and result["object"]["sha"]==GREEN
                  and read_ref(ALLOWED)==GREEN and read_ref(FORBIDDEN)==BASE,
                  "ALLOWED_REF_NOT_PROVEN")
          print(json.dumps({"ref":ALLOWED,"sha":GREEN,"http":status,"result":"SERVER_ACCEPTED"}))
          PY
